services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Sem isso, classificar um vídeo (qwen 7b + moondream, tudo em CPU) podia
    # tomar todos os núcleos/RAM do host e travar a máquina inteira (WSL2 não
    # limita por conta própria). Ajustável via .env se a sua máquina aguentar
    # mais ou precisar de menos.
    cpus: ${OLLAMA_CPUS:-6}
    mem_limit: ${OLLAMA_MEM_LIMIT:-6g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Broker de mensagens: fila que desacopla "o arquivo chegou" (api) de "o
  # arquivo foi classificado e subiu pro Drive" (worker). Container próprio
  # — mais fácil de explicar "broker separado do consumidor", que é o
  # próprio conceito de sistema distribuído que este projeto quer mostrar.
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # API HTTP (Flask): login com Google, upload, busca, status da fila —
  # nenhum HTML é renderizado aqui, só JSON (ver api/app.py).
  api:
    build: .
    command: flask --app api.app run --host=0.0.0.0 --port=5000 --debug
    volumes:
      - .:/app
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OAUTHLIB_INSECURE_TRANSPORT: "1" # só p/ dev local em http:// — nunca em produção
    env_file:
      - .env
    depends_on:
      - ollama
      - redis
    restart: unless-stopped

  # Worker Celery: consome a fila no Redis, classifica (IA local/Gemini) e
  # sobe o resultado pro Google Drive do usuário (ver worker/tasks.py).
  worker:
    build: .
    entrypoint: ["sh", "/app/worker/entrypoint.sh"]
    volumes:
      - .:/app
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # Prefork padrão do Celery sobe 1 processo por núcleo — pesado à toa
      # pra tarefas que já são CPU-bound sozinhas (transcrição/classificação
      # local). Ver worker/entrypoint.sh. Ajustável no .env.
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-1}
    env_file:
      - .env
    # Some da RAM/CPU do host (faster-whisper + manuseio de frames), além do
    # que o container `ollama` já reserva pra si — ver comentário lá.
    cpus: ${WORKER_CPUS:-2}
    mem_limit: ${WORKER_MEM_LIMIT:-3g}
    depends_on:
      - ollama
      - redis
    restart: unless-stopped

  # Front estático (HTML/CSS/JS solto, sem build step) + reverse proxy das
  # rotas de dados pro serviço "api" (ver frontend/nginx.conf).
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama_data:
