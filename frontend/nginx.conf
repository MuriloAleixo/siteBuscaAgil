# frontend/nginx.conf
#
# Serve as páginas HTML/CSS/JS estáticas direto (sem template engine, sem
# build step) e faz proxy_pass das rotas de dados pro serviço "api" (Flask)
# — o navegador enxerga uma origem só (http://localhost/), então o cookie
# de sessão funciona sem precisar configurar CORS. Isso é o "gateway" na
# frente dos dois sistemas (front estático + api) — um padrão clássico de
# sistemas distribuídos (reverse proxy).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 110m;

    location = / {
        return 302 /index.html;
    }

    location /static/ {
        try_files $uri =404;
    }

    # Tudo que é dado/sessão/fila vive no serviço "api" (Flask) — só essas
    # rotas passam pelo proxy; o resto é arquivo estático servido pelo
    # próprio nginx.
    location ~ ^/(auth|me|upload|add-link|files|search-query|queue|processing-log|media)(/|$) {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
