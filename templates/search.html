{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesquisa Avançada — BuscaÁgil</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}" />
  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter','sans-serif'], mono: ['Space Grotesk','monospace'] } } } }
  </script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
</head>
<body class="grid-bg">

<div class="dashboard-layout">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <a href="dashboard.html" class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-xl flex items-center justify-center pulse" style="background:linear-gradient(135deg,var(--violet),var(--cyan))">
          <i data-lucide="search" class="w-4 h-4 text-white"></i>
        </div>
        <span class="logo-text text-lg text-white">Busca<span class="gradient-text">Ágil</span></span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Mecanismo de Busca</span>
      <a href="dashboard.html" class="nav-item">
        <i data-lucide="layout-grid" class="nav-icon"></i>
        <span>Dashboard</span>
      </a>
      <a href="search.html" class="nav-item active">
        <i data-lucide="search" class="nav-icon"></i>
        <span>Buscar Arquivos</span>
      </a>
      <a href="upload.html" class="nav-item">
        <i data-lucide="upload-cloud" class="nav-icon"></i>
        <span>Enviar Arquivo</span>
      </a>
      <span class="nav-section-label">Sua Conta</span>
      <a href="profile.html" class="nav-item">
        <i data-lucide="user-circle" class="nav-icon"></i>
        <span>Perfil / Drive</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="flex items-center gap-3 p-3 rounded-xl" style="background:var(--bg-card);border:1px solid var(--border)">
        <img id="sidebar-avatar" src="" alt="Avatar" class="avatar avatar-sm" />
        <div class="flex-1 min-w-0">
          <p id="sidebar-name" class="text-xs font-bold text-white truncate" style="font-family:'Space Grotesk',sans-serif"></p>
          <p class="text-xs truncate text-cyan-400">Drive Conectado ✓</p>
        </div>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- ── MAIN CONTENT ── -->
  <div class="main-content">
    <header class="top-header">
      <button class="btn btn-ghost btn-icon lg:hidden" id="sidebar-toggle">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      <div class="flex-1">
        <h2 class="text-sm font-bold text-white" style="font-family:'Space Grotesk',sans-serif">Central de Pesquisa</h2>
      </div>
      <a href="profile.html">
        <img id="header-avatar" src="" alt="Avatar" class="avatar avatar-sm" />
      </a>
    </header>

    <main class="page-content fade-up">

      <!-- Giant Search Input (Spotlight Style) -->
      <div class="mb-10 text-center max-w-3xl mx-auto">
        <span class="text-xs font-bold uppercase tracking-widest text-cyan-400 mb-2 block" style="font-family:'Space Grotesk',sans-serif">Spotlight Search</span>
        <h1 class="text-3xl font-extrabold text-white mb-6" style="font-family:'Space Grotesk',sans-serif">
          O que você quer encontrar?
        </h1>

        <div class="hero-search-wrap">
          <div class="hero-search-glow"></div>
          <div class="hero-search-inner" style="background:rgba(12,12,34,0.95)">
            <i data-lucide="search" class="w-6 h-6 text-purple-400 flex-shrink-0"></i>
            <input
              type="text"
              id="search-page-input"
              class="hero-search-input"
              placeholder="Digite qualquer nome, tipo, tag ou extensão..."
              autocomplete="off"
              autofocus
            />
            <button id="clear-btn" class="hidden btn btn-ghost btn-sm" onclick="clearSearchInput()" style="color:var(--text-3)">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- Quick filter pill bar -->
        <div class="flex flex-wrap items-center justify-center gap-2 mt-6" id="search-filter-chips">
          <button class="filter-chip active" data-type="all" onclick="setSearchFilter('all')">Todos os arquivos</button>
          <button class="filter-chip" data-type="image" onclick="setSearchFilter('image')"><i data-lucide="image" class="w-3.5 h-3.5 text-cyan-400"></i> Imagens</button>
          <button class="filter-chip" data-type="pdf" onclick="setSearchFilter('pdf')"><i data-lucide="file-text" class="w-3.5 h-3.5 text-orange-400"></i> PDFs</button>
          <button class="filter-chip" data-type="video" onclick="setSearchFilter('video')"><i data-lucide="play-circle" class="w-3.5 h-3.5 text-purple-400"></i> Vídeos</button>
          <button class="filter-chip" data-type="doc" onclick="setSearchFilter('doc')"><i data-lucide="file" class="w-3.5 h-3.5 text-blue-400"></i> Documentos</button>
          <button class="filter-chip" data-type="sheet" onclick="setSearchFilter('sheet')"><i data-lucide="table" class="w-3.5 h-3.5 text-green-400"></i> Planilhas</button>
          <button class="filter-chip" data-type="link" onclick="setSearchFilter('link')"><i data-lucide="link" class="w-3.5 h-3.5 text-yellow-400"></i> Links</button>
        </div>
      </div>

      <!-- Results stats -->
      <div class="flex items-center justify-between pb-3 border-b mb-6 max-w-4xl mx-auto" style="border-color:var(--border)">
        <span id="search-results-info" class="text-xs font-semibold" style="color:var(--text-2);font-family:'Space Grotesk',sans-serif"></span>
        <select class="sort-select text-xs" id="search-sort" onchange="runSearch()">
          <option value="date-desc">Mais recentes</option>
          <option value="name-asc">Nome A–Z</option>
          <option value="size-desc">Maior tamanho</option>
        </select>
      </div>

      <!-- Results list -->
      <div id="search-results-list" class="flex flex-col gap-3 max-w-4xl mx-auto"></div>

      <!-- Empty state -->
      <div id="search-empty" class="empty-state hidden">
        <div class="empty-icon">
          <i data-lucide="search-x" class="w-10 h-10"></i>
        </div>
        <h3 class="text-lg font-bold text-white" style="font-family:'Space Grotesk',sans-serif">Nenhum resultado</h3>
        <p id="search-empty-text" style="color:var(--text-2);font-size:14px"></p>
      </div>

    </main>
  </div>
</div>

<!-- Mobile Bottom Nav -->
<nav class="mobile-nav">
  <div class="mobile-nav-items">
    <a href="dashboard.html" class="mobile-nav-item"><i data-lucide="search"></i><span>Dashboard</span></a>
    <a href="search.html" class="mobile-nav-item active"><i data-lucide="search"></i><span>Buscar</span></a>
    <a href="upload.html" class="mobile-nav-item"><i data-lucide="upload-cloud"></i><span>Enviar</span></a>
    <a href="profile.html" class="mobile-nav-item"><i data-lucide="user-circle"></i><span>Perfil</span></a>
  </div>
</nav>

<script>window.__BUSCA_AGIL_USER__ = {{ busca_agil_user_json|safe }};</script>
<script src="{% static 'js/catalog-client.js' %}"></script>
<script src="{% static 'js/file-utils.js' %}"></script>
<script src="{% static 'js/auth.js' %}"></script>
<script src="{% static 'js/search.js' %}"></script>
</body>
</html>
